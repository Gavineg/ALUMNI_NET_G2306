<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>G2306 蹭饭图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://registry.npmmirror.com/echarts/4.9.0/files/map/js/china.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>

  <canvas id="noise-canvas"></canvas>
  <div class="vignette"></div>
  <div class="scanline"></div>

  <header id="hud-header">
    <h1 id="header-text"></h1>
    <p  id="header-subtext"></p>
    <div id="reset-btn" onclick="resetMap()">[SYS.RESTORE_VIEW]</div>
    <div id="dos-input-wrap">
      <span id="dos-prompt">C:\G2306></span>
      <input id="dos-input" type="text" autocomplete="off" spellcheck="false" placeholder="TYPE HELP OR ?">
    </div>
  </header>

  <div id="map-container" style="width:100%;height:100%;opacity:0;transition:opacity 1s ease-in;"></div>

  <div id="info-panel">
    <span class="close-btn" id="close-btn">[ABORT]</span>
    <div class="panel-header">&gt; SYS.TARGET_DECRYPT //</div>
    <div id="terminal-content"></div>
  </div>

  <!-- 全屏模式底部输入行 -->
  <div id="fullscreen-input-row" class="hidden">
    <span id="fullscreen-prompt">C:\G2306&gt;&nbsp;</span>
    <input id="fullscreen-input" type="text" autocomplete="off" spellcheck="false">
  </div>

  <script type="module">
    import { FLIGHT_TIME, NODE_DELAY } from './js/config.js';
    import { glitchResolve, typeWrite, sleep, abortBios } from './js/boot.js';
    import { fetchMapData } from './js/map-data.js';
    import { launchParticles, revealTargets, startNoiseLayer } from './js/map-particles.js';
    import { initMapUI, closePanel, openPanel, clearTerminal, flyToCoord } from './js/map-ui.js';
    import { runCommand, restoreTheme, getPromptPrefix } from './js/terminal-cmd.js';
    import { biosAppend } from './js/boot.js';

    // 恢复上次会话的主题（在任何 DOM 操作前）
    restoreTheme();

    const isMobile    = window.innerWidth < 768;
    const initZoom    = isMobile ? 1.8 : 1.2;
    const initCenter  = isMobile ? [105.0, 32.0] : [104.2, 35.9];

    const chart       = echarts.init(document.getElementById('map-container'));
    const headerEl    = document.getElementById('header-text');
    const subEl       = document.getElementById('header-subtext');

    // 噪点层启动
    startNoiseLayer();

    // 地图基础配置
    function baseGeoOption(roam = false) {
      return {
        backgroundColor: 'transparent',
        tooltip: { show: false },
        geo: {
          map: 'china', roam,
          zoom: initZoom, center: initCenter,
          scaleLimit: { min: 0.4, max: 8 },
          itemStyle: {
            areaColor: '#060a0f',
            borderColor: 'rgba(184,255,71,0.22)',
            borderWidth: 0.8,
            borderType: 'dashed'
          },
          emphasis: {
            itemStyle: { areaColor: '#0e1520', borderColor: '#b8ff47' },
            label: { show: false }
          }
        },
        series: []
      };
    }

    async function boot() {
      // 乱码启动
      await glitchResolve(headerEl, 'BOOTING ALUMNI_NET...', 140, 12);
      await typeWrite(subEl, 'INITIALIZING MAP MODULE...', 12);

      // 地图显示
      document.getElementById('map-container').style.opacity = '1';
      chart.setOption(baseGeoOption(false));

      // 拉取数据，失败则自动重连
      subEl.textContent = '';
      await typeWrite(subEl, 'FETCHING TARGET DATA...', 12);

      let mapData = null;
      let retryCount = 0;
      while (!mapData) {
        mapData = await fetchMapData().catch(() => null);
        if (!mapData) {
          retryCount++;
          subEl.textContent = '';
          await typeWrite(subEl, `[ERR] API FAULT — RETRY ${retryCount} IN 2S...`, 12);
          await sleep(2000);
          subEl.textContent = '';
          await typeWrite(subEl, 'RECONNECTING...', 12);
        }
      }

      await glitchResolve(headerEl, '[G2306] CHUANG XIN BASE', 140, 12);
      subEl.textContent = '';
      await typeWrite(subEl, 'LAUNCHING TRACER SWARM...', 12);

      launchParticles(chart, mapData.originCoords, mapData.linesData, FLIGHT_TIME);

      await sleep(FLIGHT_TIME + 200);

      // 解锁地图
      chart.setOption({ geo: { roam: true } });

      subEl.textContent = '';
      await typeWrite(subEl, 'SIGNAL LOCKING TARGETS...', 12);

      lastMapData = mapData;
      await revealTargets(chart, mapData.scatterData, mapData.linesData, mapData.colorMode);

      subEl.textContent = '';
      await typeWrite(subEl, 'ALL TARGETS LOCKED. SYSTEM READY.', 12);

      initMapUI(chart, initZoom, initCenter);

      // 重置按钮：打字出现
      const resetBtn = document.getElementById('reset-btn');
      resetBtn.classList.add('visible');
      resetBtn.textContent = '';
      const resetLabel = '[SYS.RESTORE_VIEW]';
      for (const ch of resetLabel) {
        resetBtn.textContent += ch;
        await sleep(20 + Math.random() * 25);
      }

      // DOS 输入框：再打字出现（按钮先于输入框）
      if (!isMobile) await showDosTerminal();
    }

    // 降级演示数据（无 API 时使用）
    async function bootDemo() {
      await glitchResolve(headerEl, '[G2306] CHUANG XIN BASE', 280, 34);
      subEl.textContent = '';
      await typeWrite(subEl, 'LAUNCHING TRACER SWARM... [DEMO MODE]', 22);

      const originCoords = [114.247, 22.723];
      const demoUnis = [
        { university:'NaN', city:'NaN', longitude:116.40, latitude:39.90, members:[{name:'NaN',major:'NaN',canCengfan:true,status:''}] },
        { university:'NaN', city:'NaN', longitude:121.47, latitude:31.23, members:[{name:'NaN',major:'NaN',canCengfan:false,status:''}] },
        { university:'NaN', city:'NaN', longitude:104.06, latitude:30.67, members:[{name:'NaN',major:'NaN',canCengfan:true,status:''}] },
        { university:'NaN', city:'NaN', longitude:113.26, latitude:23.13, members:[{name:'NaN',major:'NaN',canCengfan:true,status:''}] },
        { university:'NaN', city:'NaN', longitude:108.94, latitude:34.26, members:[{name:'NaN',major:'NaN',canCengfan:false,status:''}] }
      ];

      const scatterData = demoUnis.map(u => ({
        name: u.university, value: [u.longitude, u.latitude, u],
        nodeColor: '#b8ff47', canCengfan: u.members.some(m => m.canCengfan)
      }));
      scatterData.sort((a,b) => Math.hypot(a.value[0]-originCoords[0],a.value[1]-originCoords[1]) - Math.hypot(b.value[0]-originCoords[0],b.value[1]-originCoords[1]));

      const linesData = demoUnis.map(u => ({ coords:[originCoords,[u.longitude,u.latitude]], nodeColor:'#b8ff47' }));

      chart.setOption({ geo: { roam: false } });
      launchParticles(chart, originCoords, linesData, FLIGHT_TIME);
      await sleep(FLIGHT_TIME + 200);
      chart.setOption({ geo: { roam: true } });
      await revealTargets(chart, scatterData, linesData, 'unified');
      document.getElementById('reset-btn').classList.add('visible');
      initMapUI(chart, initZoom, initCenter);
    }

    let lastMapData = null;
    boot().then(() => {}); // 保持原有启动流程

    window.resetMap = function() {
      chart.setOption({ geo: { zoom: initZoom, center: initCenter } });
      closePanel();
      // keep focus on DOS input, don't steal it
      requestAnimationFrame(() => dosInput.focus());
    };

    document.getElementById('close-btn').addEventListener('click', () => {
      // 如果是全屏模式，EXIT 还原地图
      const panel = document.getElementById('info-panel');
      if (panel.classList.contains('fullscreen')) {
        setFullscreen(false);
      } else {
        closePanel();
      }
    });
    window.addEventListener('resize', () => chart.resize());

    // ── 全屏终端控制 ───────────────────────────────────────────
    const fsInputRow    = document.getElementById('fullscreen-input-row');
    const fsInput       = document.getElementById('fullscreen-input');
    const fsPromptEl    = document.getElementById('fullscreen-prompt');

    function updateFsPrompt() {
      fsPromptEl.textContent = getPromptPrefix(localStorage.getItem('g2306_token')) + '> ';
    }

    function setFullscreen(on) {
      const panel  = document.getElementById('info-panel');
      const mapEl  = document.getElementById('map-container');
      isFullscreen = on;
      if (on) {
        panel.classList.add('active', 'fullscreen');
        document.body.classList.add('is-fullscreen');
        mapEl.style.opacity       = '0';
        mapEl.style.pointerEvents = 'none';
        document.getElementById('close-btn').textContent = '[EXIT]';
        fsInputRow.classList.remove('hidden');
        updateFsPrompt();
        setTimeout(() => fsInput.focus(), 50);
      } else {
        panel.classList.remove('fullscreen');
        document.body.classList.remove('is-fullscreen');
        mapEl.style.opacity       = '1';
        mapEl.style.pointerEvents = '';
        document.getElementById('close-btn').textContent = '[ABORT]';
        fsInputRow.classList.add('hidden');
        closePanel();
        setTimeout(() => dosInput.focus(), 50);
      }
    }

    // 全屏底部输入框的键盘处理
    fsInput.addEventListener('keydown', async e => {
      // Ctrl+C
      if (e.ctrlKey && e.key === 'c') {
        e.preventDefault();
        abortBios();
        if (pendingResolve) {
          pendingResolve.resolve(null);
          pendingResolve = null; maskValue = ''; fsInput.value = '';
        }
        commandRunning = false;
        const terminal = document.getElementById('terminal-content');
        const div = document.createElement('div');
        div.textContent = '^C'; div.style.color = 'var(--hud-danger)';
        terminal.appendChild(div);
        terminal.scrollTop = terminal.scrollHeight;
        fsInput.focus();
        return;
      }

      // History navigation
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx < history.length - 1) { histIdx++; fsInput.value = history[history.length - 1 - histIdx]; }
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx > 0) { histIdx--; fsInput.value = history[history.length - 1 - histIdx]; }
        else { histIdx = -1; fsInput.value = ''; }
        return;
      }

      // Tab completion (command names only for fullscreen DOS terminal)
      if (e.key === 'Tab') {
        e.preventDefault();
        const cur = fsInput.value.trim().toLowerCase();
        if (tabBase === null) { tabBase = cur; tabMatches = CMD_LIST.filter(c => c.startsWith(tabBase)); tabPos = 0; }
        if (!tabMatches.length) return;
        fsInput.value = tabMatches[tabPos % tabMatches.length].toUpperCase();
        tabPos++;
        return;
      }
      if (e.key !== 'Tab') tabBase = null;

      // pendingResolve（全屏下的多步骤输入走 dosInput，这里只处理 Enter 命令）
      if (e.key !== 'Enter') return;
      if (commandRunning) { fsInput.value = ''; return; }

      const cmd = fsInput.value.trim();
      fsInput.value = '';
      if (!cmd) return;
      history.push(cmd); histIdx = -1;

      commandRunning = true;
      const terminal = document.getElementById('terminal-content');
      const ctx = makeCtx();
      updateFsPrompt();
      await biosAppend(terminal, [{ text: `${getPromptPrefix(localStorage.getItem('g2306_token'))}> ${cmd}` }], 10);
      const lines = await runCommand(cmd, ctx);
      if (lines?.length) await biosAppend(terminal, lines, 10);
      commandRunning = false;
      updateFsPrompt();
      updatePrompt();
      fsInput.focus();
    });

    // ── DOS 彩蛋输入框（仅桌面端显示） ──────────────────────────
    const dosWrap     = document.getElementById('dos-input-wrap');
    const dosInput    = document.getElementById('dos-input');
    const dosPromptEl = document.getElementById('dos-prompt');

    // pendingResolve: 多步骤命令（login/passwd）等待用户输入
    let pendingResolve = null; // { resolve, mask, lineDiv }
    let maskValue = '';        // 当前密码字段的真实值

    // 命令历史 & Tab 补全
    const CMD_LIST = ['help','whoami','date','stats','find','ls','dir','cat','matrix',
                      'hack','sudo','konami','sl','fortune','42','coffee','about','credits',
                      'clear','cls','exit','quit','login','logout','me','set','passwd',
                      'scan','connect','port','crack','exploit','download','disconnect',
                      'apply','themes','restore','roster','vim','vi','mkdir','touch','rm',
                      'fullscreen','fs'];
    let history = [], histIdx = -1, tabBase = null, tabMatches = [], tabPos = 0;

    async function showDosTerminal() {
      dosWrap.style.display = 'block';
      dosPromptEl.textContent = '';
      await new Promise(r => requestAnimationFrame(r));
      dosWrap.style.opacity = '1';
      await sleep(200);
      const prompt = getPromptPrefix(localStorage.getItem('g2306_token')) + '> ';
      for (const ch of prompt) {
        dosPromptEl.textContent += ch;
        await sleep(20 + Math.random() * 30);
      }
      dosInput.classList.add('ready');
      dosInput.focus();
    }

    // 密码遮掩：input 事件 — 累加新字符到 maskValue，清空输入框，终端回显 *
    dosInput.addEventListener('input', () => {
      if (!pendingResolve?.mask) return;
      maskValue += dosInput.value;   // 累加，不是覆盖
      dosInput.value = '';
      if (pendingResolve.lineDiv) {
        pendingResolve.lineDiv.textContent = pendingResolve.label + '*'.repeat(maskValue.length);
      }
      const terminal = document.getElementById('terminal-content');
      if (!terminal._userScrolled) requestAnimationFrame(() => { terminal.scrollTop = terminal.scrollHeight; });
    });

    // 密码 Backspace：dosInput 已清空，需要手动处理删除
    dosInput.addEventListener('keydown', e => {
      if (!pendingResolve?.mask) return;
      if (e.key === 'Backspace' && maskValue.length > 0) {
        e.preventDefault();
        maskValue = maskValue.slice(0, -1);
        dosInput.value = '';
        if (pendingResolve.lineDiv) {
          pendingResolve.lineDiv.textContent = pendingResolve.label + '*'.repeat(maskValue.length);
        }
      }
    }, true); // capture phase so it fires before the main keydown handler

    function makeCtx() {
      return {
        openPanel,
        clearTerminal,
        closePanel,
        getMapData:   () => lastMapData,
        flyTo:        (lon, lat) => flyToCoord(lon, lat),
        setFullscreen,
        getToken:     () => localStorage.getItem('g2306_token'),
        setToken:     (t) => { if (t) localStorage.setItem('g2306_token', t); else localStorage.removeItem('g2306_token'); },

        promptLine: (label) => new Promise(resolve => {
          const terminal = document.getElementById('terminal-content');
          const div = document.createElement('div');
          div.textContent = label;
          terminal.appendChild(div);
          if (!terminal._userScrolled) requestAnimationFrame(() => { terminal.scrollTop = terminal.scrollHeight; });
          pendingResolve = { resolve, mask: false, lineDiv: div, label };
          maskValue = '';
          dosInput.value = '';
          dosInput.focus();
        }),

        promptPassword: (label) => new Promise(resolve => {
          const terminal = document.getElementById('terminal-content');
          const div = document.createElement('div');
          div.textContent = label;
          terminal.appendChild(div);
          if (!terminal._userScrolled) requestAnimationFrame(() => { terminal.scrollTop = terminal.scrollHeight; });
          pendingResolve = { resolve, mask: true, lineDiv: div, label };
          maskValue = '';
          dosInput.value = '';
          dosInput.focus();
        }),

        print: (lines) => {
          const terminal = document.getElementById('terminal-content');
          return biosAppend(terminal, lines, 10);
        }
      };
    }

    let isFullscreen = false;
    let commandRunning = false; // blocks new commands while one is executing

    // keep input focused at all times (unless user is interacting with something else)
    document.addEventListener('click', e => {
      if (!isMobile && !e.target.closest('a, button, input, select, textarea, [onclick]')) {
        dosInput.focus();
      }
    });


    function updatePrompt() {
      dosPromptEl.textContent = getPromptPrefix(localStorage.getItem('g2306_token')) + '> ';
    }

    // ── 主键盘监听（Enter / Ctrl+C / 历史 / Tab / 多步骤输入） ──
    dosInput.addEventListener('keydown', async e => {

      // Ctrl+C: abort ALL output, stop command, stay in fullscreen
      if (e.ctrlKey && e.key === 'c') {
        e.preventDefault();
        abortBios(); // stops all typing output immediately
        if (pendingResolve) {
          const { resolve } = pendingResolve;
          pendingResolve = null;
          maskValue = '';
          dosInput.value = '';
          resolve(null);
        }
        commandRunning = false;
        // do NOT touch isFullscreen — user must EXIT manually
        const terminal = document.getElementById('terminal-content');
        const div = document.createElement('div');
        div.textContent = '^C';
        div.style.color = 'var(--hud-danger)';
        terminal.appendChild(div);
        if (!terminal._userScrolled) requestAnimationFrame(() => { terminal.scrollTop = terminal.scrollHeight; });
        dosInput.focus();
        return;
      }

      // ── 多步骤命令等待输入 ─────────────────────────────────
      if (pendingResolve) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = pendingResolve.mask ? maskValue : dosInput.value;
          dosInput.value = '';
          maskValue = '';
          const { resolve, mask, lineDiv, label } = pendingResolve;
          pendingResolve = null;
          if (lineDiv) lineDiv.textContent = label + (mask ? '*'.repeat(val.length) : val);
          resolve(val || null);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          const { resolve } = pendingResolve;
          pendingResolve = null;
          dosInput.value = '';
          maskValue = '';
          resolve(null);
        }
        return;
      }

      // ── 上下历史 ───────────────────────────────────────────
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!history.length) return;
        histIdx = Math.min(histIdx + 1, history.length - 1);
        dosInput.value = history[history.length - 1 - histIdx];
        tabBase = null;
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx <= 0) { histIdx = -1; dosInput.value = ''; tabBase = null; return; }
        histIdx--;
        dosInput.value = history[history.length - 1 - histIdx];
        tabBase = null;
        return;
      }

      // ── Tab 补全 ───────────────────────────────────────────
      if (e.key === 'Tab') {
        e.preventDefault();
        const cur = dosInput.value.trim().toLowerCase();
        if (tabBase === null) { tabBase = cur; tabMatches = CMD_LIST.filter(c => c.startsWith(tabBase)); tabPos = 0; }
        if (!tabMatches.length) return;
        dosInput.value = tabMatches[tabPos % tabMatches.length].toUpperCase();
        tabPos++;
        return;
      }
      if (e.key !== 'Tab') tabBase = null;
      if (e.key !== 'Enter') return;

      // 全屏模式下禁止重新触发会抢占全屏的命令
      const rawCmd = dosInput.value.trim().toLowerCase().split(/\s+/)[0];
      if (isFullscreen && ['scan','roster','fullscreen','fs'].includes(rawCmd)) {
        dosInput.value = '';
        return;
      }

      // block concurrent commands
      if (commandRunning) { dosInput.value = ''; return; }

      // ── Enter：执行命令 ────────────────────────────────────
      const cmd = dosInput.value.trim();
      dosInput.value = '';
      histIdx = -1;
      if (!cmd) return;
      history.push(cmd);

      commandRunning = true;
      const terminal = document.getElementById('terminal-content');
      const ctx = makeCtx();
      openPanel();
      await biosAppend(terminal, [{ text: `${getPromptPrefix(localStorage.getItem('g2306_token'))}> ${cmd}` }], 10);
      const lines = await runCommand(cmd, ctx);
      if (lines?.length) await biosAppend(terminal, lines, 10);
      commandRunning = false;
      updatePrompt();
      dosInput.focus();
    });
    updatePrompt();

    // Auto-logout when tab closes if session was started from this terminal
    window.addEventListener('beforeunload', () => {
      if (sessionStorage.getItem('g2306_terminal_session')) {
        localStorage.removeItem('g2306_token');
        localStorage.removeItem('g2306_user');
        sessionStorage.removeItem('g2306_terminal_session');
      }
    });
  </script>
</body>
</html>
